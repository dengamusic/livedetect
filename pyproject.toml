[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livedetect"
version = "0.1.0"
description = "Real-time video detection and tracking service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "flask>=3.0",
]

[project.optional-dependencies]
# GStreamer's Python bindings (PyGObject) come from the system package manager,
# not from pip. See the README.
onnx = ["onnxruntime>=1.17"]
torch = ["torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
livedetect = "livedetect.cli:main"
livedetect-fakecam = "livedetect.fakecam:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
livedetect = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
